name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://forge:forge@localhost:5432/forge?schema=public
      NEXTAUTH_SECRET: ci-secret-for-forge-verification
      NEXTAUTH_URL: http://127.0.0.1:3210
      AUTH_TRUST_HOST: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma
        run: npm run db:generate

      - name: Run Coach Core tests
        run: npm run test:core

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run API smoke tests
        run: npm run test:api
